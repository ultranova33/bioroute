name: bioroute_driver_app
description: "Bioroute Localized Driver Navigation & Telemetry Flutter Application"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mapbox_gl: ^0.16.0
  flutter_tts: ^3.8.5
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_payload.json
